name: Unpack MINU
on:
  push:
    paths:
      - ".github/workflows/unpack.yml"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and save source
        run: |
          test -f MINU-GitHub-Upload.zip
          python3 -m zipfile -e MINU-GitHub-Upload.zip .
          rm MINU-GitHub-Upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add MINU reward program and verification"
          git push
